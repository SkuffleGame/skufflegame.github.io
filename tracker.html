<!doctype html>
<html lang="en">
  <head>
    <!-- Basic page setup and mobile responsiveness -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Skuffle is a chaotic PvP card game with AR integration and unique discard-based mechanics." />

    <title>Skuffle</title>

    <!-- Bootstrap CSS and JavaScript for layout, responsiveness, and carousel functionality -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Google Font used for the site -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet" />

    <!-- Font Awesome icons used in the navigation and LinkedIn buttons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <!-- Main custom stylesheet -->
    <link rel="stylesheet" href="style.css" />

    <!-- Favicon and app icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- This makes every link open in a new tab -->
    <base target="_blank" />
  </head>

  <body>
    <header class="py-5 header-bg text-black">
      <div class="container d-flex flex-column align-items-center text-center">
        <img
          src="img/LogoLowRes.png"
          alt="Skuffle logo"
          class="header-logo mb-3" />
        <p class="mb-0">The Chaotic PVP Card Game</p>
      </div>
    </header>

    <div class="navbar">
      <a href="index.html" target="_self">
        <i class="fa fa-fw fa-home"></i>
        <span class="nav-text"> Home</span></a
      >
      <a class="active" href="tracker.html" target="_self">
        <i class="fa fa-fw fa-heart"></i>
        <span class="nav-text"> Health Tracker</span></a
      >
      <a href="characters.html" target="_self">
        <i class="fa fa-fw fa-users"></i>
        <span class="nav-text"> Characters</span></a
      >
    </div>

    <main class="padd">
      <h1 class="tracker-title">Health Tracker</h1>

      <section id="setup-panel" class="setup-panel">
        <h2 class="setup-heading">Choose your player</h2>
        <div class="setup-controls">
          <input type="text" id="player-name" placeholder="Player name" />
          <div class="dropdown">
            <button class="dropbtn" id="character-chosen">
              Choose Character
            </button>
            <div class="dropdown-content" id="character-dropdown">
              <a href="#" target="_self" class="character-option" data-character="Cowboy"
                >Cowboy</a
              >
              <a href="#" target="_self" class="character-option" data-character="Were-Lobster"
                >Were-Lobster</a
              >
              <a href="#" target="_self" class="character-option" data-character="Goe Bling"
                >Goe Bling</a
              >
              <a href="#" target="_self" class="character-option" data-character="Salary Man"
                >Salary Man</a
              >
              <a href="#" target="_self" class="character-option" data-character="Margritte"
                >Margritte</a
              >
              <a href="#" target="_self" class="character-option" data-character="Alien"
                >Alien</a
              >
            </div>
          </div>
          <div class="button-group">
            <button id="add-player">Add Player</button>
            <button id="clear-all" style="font-size: 15px;">Clear All (Debugging)</button>
          </div>
        </div>
        <img src="img/character/Group.png" alt="Character Group" style="width: auto; height: 250px;">
      </section>

      <!-- This section is hidden at first, this will reveal itself once a player is added -->
      <section id="game-area" class="game-area hidden">
        <!-- This is where the Hero Character will appear (the chosen character) -->
        <section id="hero-panel" class="hero-panel">
          <!-- Javascript will generate the hero here -->
        </section>

        <!-- Grid section for other players -->
        <section class="other-players-section">
          <h2 class="other-players-title">Other Players</h2>

          <div id="players-grid" class="players-grid">
            <!-- Player cards will be generated here -->
          </div>
        </section>
      </section>
    </main>


    <div class="spacer_box"></div>

    <div class="footer_block">
      <p class="text-center" id="current_year"></p>
      <p class="text-center">
        A project by Aaron, Tom, Adriana, Tadhg and Katerina
      </p>
    </div>

    <!-- external script file-->
    <script type="module" src="myScript.js"></script>

    <script>
      document.getElementById("current_year").textContent =
        `Skuffle © ${new Date().getFullYear()}`;
    </script>
  </body>
</html>
