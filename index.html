<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skuffle Test - Health Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .player {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .health-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        button {
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }
        .health-value {
            font-size: 24px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }
        #add-player {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
        input {
            padding: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Health Tracker</h1>
    
    <div>
        <input type="text" id="player-name" placeholder="Player name">
        <button id="add-player">Add Player</button>
    </div>

    <div id="players"></div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js';
        import { getDatabase, ref, onValue, set, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-analytics.js";


        // TODO: Replace with your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyAXUdeglgszb0WflC5o8VuXBuO1V3OzHWQ",
            authDomain: "skuffletest.firebaseapp.com",
            databaseURL: "https://skuffletest-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "skuffletest",
            storageBucket: "skuffletest.firebasestorage.app",
            messagingSenderId: "656546117071",
            appId: "1:656546117071:web:25437409b3c2e155fa8eba",
            measurementId: "G-N5XBTS2ZW6"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const database = getDatabase(app);
        const playersRef = ref(database, 'players');

        // Listen for changes
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            displayPlayers(data);
        });

        function displayPlayers(players) {
            const container = document.getElementById('players');
            container.innerHTML = '';

            if (!players) return;

            for (let id in players) {
                const player = players[id];
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player';
                
                playerDiv.innerHTML = `
                    <div>${player.name}</div>
                    <div class="health-control">
                        <button onclick="changeHealth('${id}', -1)">-</button>
                        <div class="health-value">${player.health}</div>
                        <button onclick="changeHealth('${id}', 1)">+</button>
                    </div>
                `;
                
                container.appendChild(playerDiv);
            }
        }

        window.changeHealth = function(playerId, change) {
            const playerRef = ref(database, 'players/' + playerId);
            
            onValue(playerRef, (snapshot) => {
                const player = snapshot.val();
                let newHealth = player.health + change;
                
                // Cap at 0 minimum and 20 maximum
                newHealth = Math.max(0, Math.min(20, newHealth));
                
                update(playerRef, { health: newHealth });
            }, { onlyOnce: true });
        };

        document.getElementById('add-player').addEventListener('click', () => {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim();
            
            if (name) {
                const newPlayerRef = ref(database, 'players/' + Date.now());
                set(newPlayerRef, {
                    name: name,
                    health: 20
                });
                nameInput.value = '';
            }
        });
    </script>

</body>
</html>
